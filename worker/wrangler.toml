name = "rameng-crm"
account_id = "45834d92b0992b24644537fc864542e4"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Check registered read feeds in small batches; each feed refreshes at most once per 24 hours.
[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "CONFIG"
id = "7676674ec22a440d8d946a8fe393775b"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]
