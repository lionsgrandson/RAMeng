name: RAM CRM checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ram-crm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Worker dependencies
        run: npm ci --prefix worker
      - name: TypeScript check
        run: npm run lint
      - name: Regression tests
        run: npm test
      - name: Worker syntax check
        run: |
          node --check worker/src/index.js
          node --check worker/src/calendarMutations.js
          node --check worker/src/communicationJournal.js
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/pdf.cjs
      - name: Production build
        run: npm run build
      - name: Whitespace check
        run: git diff --check
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix worker --omit=dev --audit-level=high
          npm audit --prefix desktop --audit-level=high
      - name: Install disposable test runtimes
        run: npm install --prefix "$RUNNER_TEMP/rameng-pg-runner" --no-save embedded-postgres@17.9.0-beta.17 pg playwright@1.64.1
      - name: Execute database workflows
        run: node tests/run-database.mjs
        env:
          RAMENG_TEST_PG_RUNTIME: ${{ runner.temp }}/rameng-pg-runner
      - name: Install test browser
        run: node "$RUNNER_TEMP/rameng-pg-runner/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Browser workflows with isolated data
        run: node tests/browser.mjs
        env:
          RAMENG_TEST_BROWSER_RUNTIME: ${{ runner.temp }}/rameng-pg-runner
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rameng-browser-qa
          path: artifacts/audit
          retention-days: 14
